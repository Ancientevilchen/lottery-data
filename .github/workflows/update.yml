name: update-lottery-data

on:
  # 推改脚本时立即验证一次（机器人自己的 commit 不会触发新 run）
  push:
    branches: [main]
  schedule:
    # 北京时间 22:40 与 23:40，各彩种当晚开奖均已出
    - cron: "40 14,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch lottery data
        id: fetch
        continue-on-error: true
        run: |
          set +e
          python3 fetch_data.py > /tmp/fetch.log 2>&1
          rc=$?
          cat /tmp/fetch.log
          if [ $rc -ne 0 ]; then
            cp /tmp/fetch.log fetch-error.log
          fi
          exit $rc

      - name: Commit data
        if: always()
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
